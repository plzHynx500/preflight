[build-system]
# hatchling 1.28+는 Metadata-Version 2.5로 빌드하는데 PyPI가 아직 이 규격을
# 거부한다(400 Bad Request — 플레이스홀더 선점 업로드에서 실측, #40). 2.4로
# 빌드되는 버전대로 고정해야 정식 배포 업로드가 통과한다.
requires = ["hatchling~=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "preflight-gpu"
version = "0.1.0"
description = "파인튜닝을 시작하기 전, 지금 환경이 실제로 준비됐는지 확인하는 진단 CLI"
readme = "readme.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Preflight team" }]
keywords = ["fine-tuning", "qlora", "lora", "cuda", "gpu", "diagnostics", "bitsandbytes"]
# 파이썬 버전은 requires-python(">=3.9")·CI 매트릭스(3.9·3.12)와 어긋나면 안 된다.
# 3.13은 CI가 돌리지 않으므로 **적지 않는다** — 검증하지 않은 것을 지원한다고 적으면
# 그 자체가 잘못된 진단 정보다(이 도구가 고치려는 문제와 같은 부류다).
#
# OS도 같은 기준이다. 처음에는 "OS Independent"로 적었는데, 그건 사실이 아니다 —
# 의존성이 순수 파이썬뿐이라 macOS에서 설치는 되지만 이 도구는 NVIDIA/CUDA 경로만
# 진단한다(NFR-01: Linux·Windows 네이티브, FR-11: macOS는 이번 범위 밖). CI도
# ubuntu·windows만 돌린다. 설치되는 것과 쓸 수 있는 것을 같다고 적으면, PyPI 검색으로
# 찾아온 macOS 사용자가 설치한 뒤에야 쓸 수 없다는 걸 알게 된다(#167).
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    # NVML 바인딩. 모듈 이름은 그대로 `pynvml`이라 코드는 바뀌지 않는다.
    # 같은 이름의 `pynvml` 배포판(13.x)은 이제 알맹이 없이 nvidia-ml-py로 넘겨주는
    # 리다이렉터일 뿐이고, 그 과정에서 FutureWarning("The pynvml package is
    # deprecated...")을 띄운다. FutureWarning은 파이썬이 기본으로 화면에 뿌리는
    # 등급이라, 진단 결과 사이에 도구 자신의 경고가 섞여 나온다 — 환경 문제를
    # 알려주는 도구로서는 그 자체가 오진 신호가 되므로 원본 패키지를 직접 잡는다.
    "nvidia-ml-py>=12",
]
# torch/transformers/bitsandbytes는 의도적으로 하드 의존성에 넣지 않는다 —
# 사용자 venv에 이미 설치된 버전을 그대로 불러와 검증하는 것이 핵심 설계이므로
# (docs/architecture.md §2 "학습 스택 연동" 참고), preflight 자신의 설치가 그 환경을
# 덮어쓰면 안 된다.

[project.urls]
Homepage = "https://github.com/plzHynx500/preflight"
Repository = "https://github.com/plzHynx500/preflight"
Issues = "https://github.com/plzHynx500/preflight/issues"
# 배포본 페이지. 실행 명령(`preflight`)과 패키지 이름(`preflight-gpu`)이 달라서
# 사용자가 어느 쪽이 맞는지 확인할 자리가 필요하다 — PyPI에는 이름이 겹치는
# 무관한 패키지가 따로 있다(#167 리뷰).
PyPI = "https://pypi.org/project/preflight-gpu/"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
preflight = "preflight.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[tool.hatch.build.targets.sdist]
# 에이전트 도구 설정·CI·개발 스크립트는 배포본에 넣지 않는다 — 진단 도구를 받는
# 사람에게 쓸모가 없고 용량만 늘린다(#65). tests/·docs/는 관례대로 남긴다.
exclude = [
    ".agents/",
    ".github/",
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "scripts/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# network 마커 테스트는 기본 실행에서 제외한다 — HuggingFace Hub에서 config.json을
# 받아오는 등 실제 네트워크·transformers/bitsandbytes 실물 라이브러리가 필요해서,
# 이 저장소의 하드 의존성만으로는(torch/transformers/bitsandbytes는 의도적으로
# 하드 의존성이 아님) 항상 돌 수 없다. `pytest -m network`로 명시적으로 켠다
# (2026-08-06, 상영님 제안 — 모킹 테스트가 "실제로 통합됐는지"까지는 검증 못 해서
# QLoRA 구현이 통째로 죽어있던 걸 못 잡았던 문제의 재발 방지).
addopts = "-m 'not network'"
markers = ["network: HuggingFace Hub 등 실제 네트워크·실물 라이브러리가 필요한 테스트"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# docs/의 예제 코드블록은 Notion 원본 서식을 그대로 보존한다(정렬된 인라인 주석 등) —
# ruff format이 기본으로 .md 안의 ```python 블록까지 재포맷하려 들어서 실제 코드와
# 무관하게 포맷 체크가 항상 실패하는 걸 실측으로 확인해 제외했다.
extend-exclude = ["docs/**"]

# `from __future__ import annotations`가 있으면 ruff는 "어노테이션은 문자열로만 남고
# 평가되지 않는다"고 보고 UP045 등으로 `Optional[X]` → `X | None` 전환을 요구한다.
# 그 전제가 이 프로젝트에서는 성립하지 않는다 — Typer는 CLI 파서를 만들려고 런타임에
# `typing.get_type_hints()`로 어노테이션을 다시 평가하고, 그 순간 Python 3.9에서
# `X | None`이 TypeError를 낸다. 실제로 이 규칙을 따랐다가 3.9에서 테스트 17개가
# 깨진 채 방치됐다(#42). requires-python이 ">=3.9"인 한 이 전환을 강제하지 않는다.
[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
