# TEAM_WORKFLOW.md §25.5 — 병합 전 최종 안전망.
# AI가 PR을 만들더라도 검증에 실패한 코드가 main에 들어가지 않게 한다.
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml의 requires-python = ">=3.9" 를 실제로 검증한다.
        # 선언한 하한(3.9)과 현행 버전(3.12) 두 지점만 돌려 CI 시간을 아낀다 —
        # 3.9는 `X | None` 같은 신문법을 못 쓰므로 하한을 안 돌리면 선언이 거짓이 된다.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # requirements.txt 대신 pyproject.toml의 dev extra를 쓴다 (hatchling 패키징).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      # 예전에는 이 단계에 continue-on-error를 걸어 뒀다 — tests/ 에 구현 전 골격
      # 스텁(`raise NotImplementedError`)이 있어서, 차단 조건으로 두면 문서만 고치는
      # PR까지 전부 빨간불이 되기 때문이었다. 그 주석은 "스텁이 사라지는 PR에서
      # 함께 지운다"는 조건을 명시해 뒀고, 스텁은 이미 전부 사라졌다.
      #
      # 그 예외가 남아 있는 동안 Python 3.9에서 테스트 17개가 실패하는 상태로 CI가
      # success를 계속 찍었다(#42). 실패를 가리는 CI는 안전망이 아니라 안전망이
      # 있다는 착각이므로, 3.9 수정과 함께 예외를 걷어낸다.
      - name: Test
        run: pytest

  # #49 — 팀 전원과 상당수 사용자가 Windows인데 위 `verify` job은 ubuntu-latest뿐이라
  # Windows 전용 회귀(예: #46의 time.monotonic 해상도 문제)를 CI가 못 잡았다.
  # `verify` job의 matrix에 os를 얹지 않고 별도 job으로 분리한 이유: matrix에 os를
  # 섞으면 GitHub가 생성하는 job 이름이 `verify (3.9)` → `verify (ubuntu-latest, 3.9)`로
  # 바뀌어, 이미 켜져 있는 branch protection의 required status check(`verify (3.9)`,
  # `verify (3.12)`)와 더 이상 매칭되지 않아 모든 PR이 막힌다. 이 job은 required로
  # 자동 편입되지 않으므로 기존 흐름을 깨지 않는다 — required로 승격할지는 사람이
  # branch protection 설정에서 별도로 정한다.
  verify-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
