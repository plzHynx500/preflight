# TEAM_WORKFLOW.md §25.5 — 병합 전 최종 안전망.
# AI가 PR을 만들더라도 검증에 실패한 코드가 main에 들어가지 않게 한다.
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml의 requires-python = ">=3.9" 를 실제로 검증한다.
        # 선언한 하한(3.9)과 현행 버전(3.12) 두 지점만 돌려 CI 시간을 아낀다 —
        # 3.9는 `X | None` 같은 신문법을 못 쓰므로 하한을 안 돌리면 선언이 거짓이 된다.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # requirements.txt 대신 pyproject.toml의 dev extra를 쓴다 (hatchling 패키징).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      # ─────────────────────────────────────────────────────────────────────
      # [테스트 단계 정책 — 지금은 의도적으로 continue-on-error]
      #
      # 현재 tests/ 에는 구현 전 골격 스텁이 있다(tests/test_engine.py 등이
      # `raise NotImplementedError`). 실수가 아니라 의도된 상태다 —
      # docs/architecture.md §5에서 모듈 경계와 계약은 확정했고 구현만 미착수다.
      #
      # 이 단계를 지금 차단 조건으로 두면 문서·인프라만 고치는 PR을 포함해 모든 PR이
      # 무조건 빨간불이 된다. 그러면 (1) 팀원이 CI 실패를 기본값으로 학습해 무시하게 되고,
      # (2) main branch protection의 "Require status checks to pass" 를 아예 켤 수 없다.
      # 즉 항상 빨간 CI는 "정직한 상태"가 아니라 안전망을 못 쓰게 만드는 상태다.
      #
      # 그래서 결과는 숨기지 않고(step은 실패로 표시되고 로그도 그대로 남는다)
      # job만 통과시킨다. 포맷·린트는 지금도 차단 조건이므로 CI는 오늘부터 실효가 있다.
      #
      # 되돌리는 시점: 첫 구현 Issue가 머지되어 NotImplementedError 스텁이 사라지는
      # 바로 그 PR에서 아래 continue-on-error 줄과 이 주석 블록을 함께 지운다.
      # (더 나은 대안: 스텁을 pytest.mark.xfail(strict=True)로 표시하면 "미구현"과
      #  "깨짐"을 pytest가 직접 구분해주므로 이 예외 자체가 필요 없어진다 — 별도 Issue 후보.)
      # ─────────────────────────────────────────────────────────────────────
      - name: Test
        continue-on-error: true
        run: pytest
